name: Deploy SpaceX Orbital Forensics v13

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/albert-lane/spacex-orbital-forensics:latest
            ghcr.io/albert-lane/spacex-orbital-forensics:v13.0.0
          labels: |
            org.opencontainers.image.source=https://github.com/Albert-lane/spacex-orbital-forensics
